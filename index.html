
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOPIK Master AI - Pedagogical Expert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #4f46e5;
      }
      body {
        font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
        background-color: #fbfcfd;
        color: #1e293b;
        -webkit-font-smoothing: antialiased;
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }

      .answer-hidden { 
        background-color: #f1f5f9; 
        color: transparent; 
        cursor: pointer; 
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        padding: 4px 12px; 
        border-radius: 6px;
        border: 1px dashed #cbd5e1;
        display: inline-block;
        user-select: none;
      }
      .answer-hidden:hover { background-color: #e2e8f0; }
      .answer-visible { 
        background-color: #dcfce7; 
        color: #166534; 
        padding: 4px 12px; 
        border-radius: 6px; 
        font-weight: 800;
        border: 1px solid #bbf7d0;
        display: inline-block;
      }

      @media print {
        header, footer, .lg\:col-span-1, button, .bg-indigo-900, .no-print, .sticky {
          display: none !important;
        }
        main {
          padding: 0 !important;
          margin: 0 !important;
          width: 100% !important;
          max-width: 100% !important;
        }
        .lg\:col-span-3 {
          width: 100% !important;
        }
        .bg-white {
          box-shadow: none !important;
          border: none !important;
        }
        .markdown-content {
          font-size: 11pt;
          line-height: 1.6;
        }
        .answer-hidden {
          background-color: transparent !important;
          color: #166534 !important;
          border: 1px dashed #ccc !important;
        }
      }
    </style>
